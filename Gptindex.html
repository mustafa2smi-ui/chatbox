<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>My Online Store</title>

<style>
body{
  font-family: Arial;
  margin:0;
  background:#f4f4f4;
}

header{
  background:#222;
  color:#fff;
  padding:15px;
  text-align:center;
}

h1{margin:0;font-size:22px;}

.container{
  width:95%;
  max-width:1200px;
  margin:auto;
}

#adminPanel{
  background:#fff;
  padding:20px;
  margin:20px 0;
  border-radius:10px;
  box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

#adminPanel h3{
  margin-top:0;
}

input{
  width:100%;
  padding:8px;
  margin:6px 0;
}

button{
  background:#007bff;
  color:white;
  border:none;
  padding:8px 12px;
  border-radius:5px;
  cursor:pointer;
}

button:hover{
  background:#0056b3;
}

#products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:15px;
  margin-bottom:40px;
}

.card{
  background:#fff;
  padding:10px;
  border-radius:8px;
  box-shadow:0 2px 6px rgba(0,0,0,0.1);
  text-align:center;
}

.card img{
  width:100%;
  height:180px;
  object-fit:cover;
  border-radius:6px;
}

.price{
  color:green;
  font-weight:bold;
  margin:5px 0;
}

.category{
  font-size:12px;
  background:#eee;
  padding:3px 6px;
  border-radius:4px;
}

/* ORDER MODAL */
#orderModal{
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.5);
}

.modal-content{
  background:#fff;
  padding:20px;
  width:90%;
  max-width:400px;
  margin:8% auto;
  border-radius:8px;
}
</style>
</head>
<body>

<header>
  <h1>My Online Store</h1>
</header>

<div class="container">

<!-- ADMIN PANEL -->
<div id="adminPanel">
  <h3>Add Product</h3>
  <input type="file" id="imageInput" required>
  <input type="text" id="name" placeholder="Product Name">
  <input type="number" id="price" placeholder="Price">
  <input type="text" id="category" placeholder="Category (cloth, toys...)">
  <button onclick="saveProduct()">Save Product</button>
</div>

<!-- PRODUCT LIST -->
<div id="products"></div>

</div>

<!-- ORDER MODAL -->
<div id="orderModal">
  <div class="modal-content">
    <h3>Order Details</h3>
    <input type="text" id="custName" placeholder="Your Name">
    <input type="text" id="phone" placeholder="Phone">
    <input type="number" id="qty" placeholder="Quantity">
    <input type="text" id="address" placeholder="Address">
    <input type="text" id="pin" placeholder="Pin Code">
    <input type="text" id="district" placeholder="District">
    <input type="text" id="state" placeholder="State">
    <button onclick="submitOrder()">Submit Order</button>
    <button onclick="closeModal()">Cancel</button>
  </div>
</div>

<script>
const WEB_APP_URL = "YOUR_WEB_APP_URL";

let selectedProduct = "";
let selectedPrice = "";

/* SAVE PRODUCT */
function saveProduct(){
  let file = document.getElementById("imageInput").files[0];
  if(!file){
    alert("Select Image First");
    return;
  }

  let reader = new FileReader();

  reader.onloadend = function(){
    let base64 = reader.result.split(",")[1];

    fetch(WEB_APP_URL,{
      method:"POST",
      body:JSON.stringify({
        type:"product",
        image:base64,
        name:document.getElementById("name").value,
        price:document.getElementById("price").value,
        category:document.getElementById("category").value
      })
    }).then(()=>{
      alert("Product Saved Successfully");
      location.reload();
    });
  };

  reader.readAsDataURL(file);
}

/* LOAD PRODUCTS */
function loadProducts(){
  fetch(WEB_APP_URL)
  .then(res=>res.json())
  .then(data=>{
    let html="";
    data.forEach(p=>{
      html+=`
      <div class="card">
        <img src="${p.image}">
        <h4>${p.name}</h4>
        <div class="price">₹${p.price}</div>
        <div class="category">${p.category}</div>
        <button onclick="orderNow('${p.name}','${p.price}')">
        Order Now
        </button>
      </div>`;
    });
    document.getElementById("products").innerHTML=html;
  });
}

loadProducts();

/* ORDER SYSTEM */
function orderNow(name,price){
  selectedProduct=name;
  selectedPrice=price;
  document.getElementById("orderModal").style.display="block";
}

function closeModal(){
  document.getElementById("orderModal").style.display="none";
}

function submitOrder(){
  fetch(WEB_APP_URL,{
    method:"POST",
    body:JSON.stringify({
      type:"order",
      productName:selectedProduct,
      price:selectedPrice,
      qty:document.getElementById("qty").value,
      customerName:document.getElementById("custName").value,
      phone:document.getElementById("phone").value,
      address:document.getElementById("address").value,
      pin:document.getElementById("pin").value,
      district:document.getElementById("district").value,
      state:document.getElementById("state").value
    })
  }).then(()=>{
    alert("Order Submitted Successfully");
    closeModal();
  });
}
</script>

</body>
</html>
