<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <style>
        body { font-family: 'Poppins', sans-serif; background: #0b0e11; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .admin-box { background: #121b22; padding: 30px; border-radius: 15px; border-top: 5px solid #00a884; width: 90%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { text-align: center; color: #00a884; }
        input, select { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #2a3942; background: #2a3942; color: white; outline: none; }
        .btn { width: 100%; padding: 12px; background: #00a884; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; }

<body>

<div class="admin-box" id="loginBox">

</div>

</div>

function checkPass() {
    let pass = document.getElementById("adminPass").value;
    if(pass === "1234") { // Apna password yahan set karein
        document.getElementById("loginBox").style.display = "none";
        document.getElementById("formContent").style.display = "block";
    } else {
        alert("Wrong Password!");
    }
}

  async function saveProduct() {
    let file1 = document.getElementById("imageInput1").files[0];
    let file2 = document.getElementById("imageInput2").files[0];
    let file3 = document.getElementById("imageInput3").files[0];
    let name = document.getElementById("name").value;
    let price = document.getElementById("price").value;

    if(!file1 || !name || !price) return alert("Kam se kam Name, Price aur Pehli Image zaroori hai!");

    let btn = document.getElementById("saveBtn");
    btn.innerText = "Uploading 3 Images... ⏳"; // User ko pata chale kaam ho raha hai
    btn.disabled = true;

    try {
        let data = {
            type: "product",
            name: name,
            price: price,
            category: document.getElementById("categoryInput").value,
            description: document.getElementById("descInput").value, // Description bhi add kar diya
            image: await toBase64(file1),
            image2: file2 ? await toBase64(file2) : null,
            image3: file3 ? await toBase64(file3) : null
        };

        const response = await fetch(WEB_APP_URL, { 
            method: "POST", 
            body: JSON.stringify(data) 
        });

        if(response.ok) {
            alert("Zabardast! Product 3 photos ke saath live ho gaya. ✅");
            location.reload();
        } else {
            throw new Error("Server Error");
        }
    } catch (err) {
        alert("Error: " + err.message);
        btn.disabled = false;
        btn.innerText = "SAVE & PUBLISH";
    }
}

const toBase64 = file => new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = () => resolve(reader.result.split(",")[1]);
    reader.onerror = error => reject(error);
});
