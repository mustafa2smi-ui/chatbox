.sidebar {
    height: 100%; width: 0; position: fixed; z-index: 3000; top: 0; left: 0;

}
.image-container {
    display: flex;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    scrollbar-width: none; /* Firefox */
}
.image-container::-webkit-scrollbar { display: none; } /* Chrome/Safari */

.image-container img {
    flex: 0 0 100%; /* Ek baar mein ek photo dikhegi */

    object-fit: contain;

.scroll-dots { display: flex; justify-content: center; gap: 5px; margin-top: 5px; }

.blink-text {

function renderUI(data, append = false) {
    const container = document.getElementById("products");
    const start = (currentPage - 1) * itemsPerPage;
    const end = start + itemsPerPage;
    const paginatedData = data.slice(start, end);

    let html = paginatedData.map(p => {
        // 3 Images Slider Logic
        let imagesHTML = `<img src="${p.image}" loading="lazy">`;
        if(p.image2) imagesHTML += `<img src="${p.image2}" loading="lazy">`;
        if(p.image3) imagesHTML += `<img src="${p.image3}" loading="lazy">`;

        return `
        <div class="card">
            <div class="image-container">
                ${imagesHTML}
            </div>
            <div class="scroll-dots">
                <div class="dot"></div>
                ${p.image2 ? '<div class="dot"></div>' : ''}
                ${p.image3 ? '<div class="dot"></div>' : ''}
            </div>
            <div style="padding:10px;">
                <h4 style="margin:5px 0;">${p.name}</h4>
                <p style="font-size:12px; color:#8696a0; height:35px; overflow:hidden;">${p.description || ''}</p>
                <div class="price">₹${p.price}</div>
                <div style="display:flex; gap:5px; margin-top:10px;">
                    <button class="btn" onclick="orderNow('${p.name}','${p.price}')">ORDER</button>
                    <button class="btn" style="width:50px; background:#25D366;" onclick="shareProduct('${p.name}','${p.price}')">🔗</button>
                </div>
            </div>
        </div>`;
    }).join('');

    if (append) {
        container.innerHTML += html;
    } else {
        container.innerHTML = html || "<h3>No Items Found</h3>";
    }

    // Load More Button Visibility
    const loadMoreBtn = document.getElementById("loadMoreBtn");
    if (data.length > end) {
        loadMoreBtn.style.display = "block";
    } else {
        loadMoreBtn.style.display = "none";
    }
}

function loadMore() {
    currentPage++;
    renderUI(allData, true);
}

function filterCat(cat, el){
    document.querySelectorAll('.cat-item').forEach(i => i.classList.remove('active'));
    el.classList.add('active');
    renderUI(cat === 'All' ? allData : allData.filter(p => p.category === cat));
}

    function submitOrder() {
    // Basic Details
    let name = document.getElementById("custName").value;
    let phone = document.getElementById("phone").value;
    let email = document.getElementById("custEmail").value;
    
    // Address Details
    let city = document.getElementById("city").value;
    let landmark = document.getElementById("landmark").value;
    let pin = document.getElementById("pincode").value;
    let dist = document.getElementById("district").value;
    let state = document.getElementById("state").value;

    if(!name || !phone || !email || !city || !pin) return alert("Kripya zaroori details bharein!");

    // Email ko browser me save karna (Remember me feature)
    localStorage.setItem("userEmail", email);
    localStorage.setItem("userPhone", phone);

    // Poora Address ek string mein
    let fullAddress = `Village/City: ${city}, Landmark: ${landmark}, Pin: ${pin}, Dist: ${dist}, State: ${state}`;

    fetch(WEB_APP_URL, {
        method: "POST",
        body: JSON.stringify({
            type: "order",
            productName: selName,
            price: selPrice,
            qty: 1,
            customerName: name,
            phone: phone,
            email: email,
            address: fullAddress
        })
    }).then(() => {
        alert("Shukriya! Aapka order mil gaya hai. ✅");
        closeModal();
    });
}

    selName = name; selPrice = price;
    document.getElementById("selNameText").innerText = name;

    if(localStorage.getItem("userEmail")) {
        document.getElementById("custEmail").value = localStorage.getItem("userEmail");
        document.getElementById("phone").value = localStorage.getItem("userPhone");
    }
}

async function openHistoryModal() {
    document.getElementById("historyModal").style.display = "block";
    const email = localStorage.getItem("userEmail");
    const listDiv = document.getElementById("historyList");
    
    listDiv.innerHTML = "<p>Orders dhund rahe hain... 🔍</p>";

    try {
        const resp = await fetch(WEB_APP_URL + "?type=history&email=" + email);
        const orders = await resp.json();

        if (orders.length === 0) {
            listDiv.innerHTML = "<p>Abhi tak koi order nahi mila.</p>";
            return;
        }

        let html = orders.map(h => {
            // 24 Hours Logic
            // Note: Date format "dd MMM yyyy" ko JavaScript Date object me convert karna
            const orderDate = new Date(h.date);
            const now = new Date();
            const timeDiff = Math.abs(now - orderDate);
            const diffHours = timeDiff / (1000 * 60 * 60);

            // Cancel Button sirf tab dikhega jab order 24 ghante se purana na ho
            let cancelBtnHTML = "";
            if (diffHours <= 24) {
                cancelBtnHTML = `
                <button onclick="contactForCancel('${h.productName}', '${h.date}')" 
                        style="margin-top:10px; background:#ff4b2b; color:white; border:none; padding:8px 12px; border-radius:5px; font-size:12px; font-weight:bold; cursor:pointer; width:100%;">
                    CANCEL / EDIT ORDER ❌
                </button>`;
            } else {
                cancelBtnHTML = `<p style="font-size:10px; color:#ef5350; margin-top:10px; text-align:center;">Editing time expired (24h limit)</p>`;
            }

            return `
            <div style="background:#2a3942; padding:15px; border-radius:10px; margin-bottom:10px; border-left:4px solid var(--accent); text-align:left;">
                <h4 style="margin:0; color:white;">${h.productName || 'No Name'}</h4>
                <div style="display:flex; justify-content:space-between; margin-top:10px;">
                    <span style="color:var(--accent); font-weight:bold;">₹${h.price || '0'}</span>
                    <span style="font-size:12px; color:#8696a0;">${h.date || 'No Date'}</span>
                </div>
                <p style="font-size:12px; color:#8696a0; margin:5px 0 0 0;">Quantity: ${h.qty || '1'}</p>
                ${cancelBtnHTML}
            </div>`;
        }).join('');

        listDiv.innerHTML = html;
    } catch (e) {
        listDiv.innerHTML = "<p>Error: Data load nahi ho paya.</p>";
    }
}

    // Kisi bhi input ko safe banane ke liye ye function use karein
function escapeHTML(str) {
    return str.replace(/[&<>"']/g, function(m) {
        return {
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;'
        }[m];
    });
}

    function shareProduct(name, price) {
    const currentUrl = window.location.href;
    const msg = `🚀 *Check this out on Shopyou Store!*\n\n*Product:* ${name}\n*Price:* ₹${price}\n\nVisit karein:`;
    
    if (navigator.share) {
        navigator.share({
            title: name,
            text: msg,
            url: currentUrl // Browser yahan khud link jodd dega
        }).catch(err => console.log(err));
    } else {
        const waUrl = `https://wa.me/?text=${encodeURIComponent(msg + " " + currentUrl)}`;
        window.open(waUrl, '_blank');
    }
}
function calculateTotal() {
    let qty = document.getElementById("orderQty").value;
    let total = qty * selPrice; // selPrice humne orderNow() me save kiya tha
    
    let box = document.getElementById("totalBox");
    if (qty > 1) {
        box.style.display = "block";
        document.getElementById("liveTotal").innerText = "₹" + total;
    } else {
        box.style.display = "none";
    }
}
